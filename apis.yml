name: Gnip
description: 'Gnip was a social media data aggregation company founded in 2008 in Boulder, Colorado by
  Eric Marcoullier and Jud Valeski. It became the first authorized reseller of the Twitter "firehose"
  and delivered enterprise-grade access to real-time and historical social data from Twitter, Tumblr,
  WordPress, Disqus, StockTwits and many other sources through products such as PowerTrack, Historical
  PowerTrack, the Search API, the Audience API and the Engagement API. Twitter acquired Gnip in April 2014
  and folded its technology into Twitter''s enterprise data platform; the Gnip brand and standalone APIs
  were retired and gnip.com now 301-redirects to the Twitter/X enterprise developer documentation. This
  profile is preserved for historical/network completeness — Gnip is no longer an independent provider.'
